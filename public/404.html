<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>
  <script>
    // SPA redirect for static hosting
    // Routes like /v1/dashboard should load /v1/index.html
    var path = window.location.pathname;

    if (path.startsWith('/v1')) {
      window.location.replace('/v1/?route=' + encodeURIComponent(path.replace('/v1', '')));
    } else if (path.startsWith('/v2')) {
      window.location.replace('/v2/?route=' + encodeURIComponent(path.replace('/v2', '')));
    } else if (path.startsWith('/v3')) {
      window.location.replace('/v3/?route=' + encodeURIComponent(path.replace('/v3', '')));
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>

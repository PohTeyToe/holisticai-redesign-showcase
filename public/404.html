<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect hack
    // Routes like /holisticai-redesign-showcase/v1/dashboard should load /holisticai-redesign-showcase/v1/index.html
    var path = window.location.pathname;
    var base = '/holisticai-redesign-showcase';

    if (path.startsWith(base + '/v1')) {
      window.location.replace(base + '/v1/?route=' + encodeURIComponent(path.replace(base + '/v1', '')));
    } else if (path.startsWith(base + '/v2')) {
      window.location.replace(base + '/v2/?route=' + encodeURIComponent(path.replace(base + '/v2', '')));
    } else if (path.startsWith(base + '/v3')) {
      window.location.replace(base + '/v3/?route=' + encodeURIComponent(path.replace(base + '/v3', '')));
    } else {
      window.location.replace(base + '/');
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
